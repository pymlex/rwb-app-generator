server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' https://tile.openstreetmap.org https://*.tile.openstreetmap.org; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    location /api/ { proxy_pass http://backend:8080; }
    location /health/ { proxy_pass http://backend:8080; }
    location = /health { proxy_pass http://backend:8080; }
    location = /metrics { proxy_pass http://backend:8080; }
    location /openapi/ { proxy_pass http://backend:8080; }
    location /swagger/ { proxy_pass http://backend:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
