services:
  database:
    build: ./database
    image: rwb-app-generator/postgis:17.9
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: 640m
  backend:
    build: ./backend
    environment:
      DATABASE_URL: Host=database;Database=app;Username=app;Password=${POSTGRES_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
      DRIVER_TOKEN: ${DRIVER_TOKEN:?Set DRIVER_TOKEN}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 384m
  frontend:
    build: ./frontend
    ports:
      - '${APP_PORT:-8080}:8080'
    depends_on: [backend]
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:8080/health/ready || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 96m
  lock:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    image: node:22-bookworm-slim
    profiles: [checks]
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      NPM_CONFIG_CACHE: /tmp/npm
    command: [npm, install, --package-lock-only, --ignore-scripts, --no-audit, --no-fund]
    mem_limit: 512m
  backend-lock:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: [checks]
    working_dir: /app
    volumes:
      - ./backend:/app
      - nuget-cache:/root/.nuget/packages
    environment:
      DOTNET_CLI_HOME: /tmp/dotnet
    command: [dotnet, restore, App.csproj, --use-lock-file]
    mem_limit: 512m
  unit:
    build:
      context: .
      dockerfile: backend-unit/Dockerfile
    profiles: [checks]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
  acceptance:
    image: python:3.12-alpine
    profiles: [checks]
    environment:
      BASE_URL: http://frontend:8080
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      DRIVER_TOKEN: ${DRIVER_TOKEN}
    volumes:
      - ./tests:/tests:ro
    command: [python, -m, unittest, discover, -v, -s, /tests]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
  audit:
    build:
      context: .
      dockerfile: checks/audit/Dockerfile
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    profiles: [checks]
    volumes:
      - ./reports:/reports
      - scanner-cache:/root/.cache
    command: [fs, --scanners, 'vuln,secret', --skip-files, /src/.env, --skip-dirs, '/src/.pipeline,/src/frontend/node_modules', --severity, 'HIGH,CRITICAL', --exit-code, '1', --format, json, --output, /reports/security.json, /src]
    mem_limit: 512m
  sast:
    image: semgrep/semgrep:1.145.0
    profiles: [checks]
    working_dir: /src
    environment:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
      HOME: /tmp
    volumes:
      - ./backend:/src/backend:ro
      - ./frontend/src:/src/frontend/src:ro
      - ./reports:/reports
    command: [semgrep, scan, --config, p/csharp, --config, p/typescript, --config, p/secrets, --severity, ERROR, --error, --strict, --metrics, 'off', --disable-version-check, --json-output, /reports/sast.json, /src/backend, /src/frontend/src]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
  sast-dotnet:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: [checks]
    working_dir: /app
    environment:
      DOTNET_CLI_HOME: /tmp/dotnet
    volumes:
      - ./backend:/app
      - ./reports:/reports
      - nuget-cache:/root/.nuget/packages
    command: [dotnet, build, App.csproj, --no-restore, --no-incremental, '-p:SastFallback=true', '-p:ErrorLog=/reports/sast.json,version=2.1']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
  spectral:
    build:
      context: .
      dockerfile: checks/spectral/Dockerfile
    profiles: [checks]
    volumes:
      - ./reports:/reports
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
  schemathesis:
    build:
      context: .
      dockerfile: checks/schemathesis/Dockerfile
    profiles: [checks]
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      HOME: /tmp
    volumes:
      - ./reports:/reports
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
  e2e:
    build:
      context: .
      dockerfile: checks/e2e/Dockerfile
    profiles: [checks]
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      E2E_SCENARIO: ${E2E_SCENARIO:-{}}
      HOME: /tmp
    volumes:
      - ./reports:/reports
    read_only: true
    tmpfs: [/tmp]
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
volumes:
  database:
  scanner-cache:
  nuget-cache:
