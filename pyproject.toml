[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rwb-app-generator"
version = "0.1.0"
description = "Requirements-driven application generation with Qwen"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.12,<3", "pypdf>=6,<7", "tqdm>=4.67,<5", "jinja2>=3.1.6,<4", "langgraph>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[project.scripts]
rwb = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["generator*"]

[tool.setuptools.package-data]
generator = ["templates/**/*", "templates/.*", "templates/**/.*", "prompts/*.md", "skills/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
lines-after-imports = 2
