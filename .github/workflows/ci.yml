name: generator
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, rwb-vm]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare isolated VM environment
        run: |
          python3 -m venv --without-pip .venv
          curl --fail --silent --show-error https://bootstrap.pypa.io/get-pip.py -o "$RUNNER_TEMP/rwb-get-pip.py"
          .venv/bin/python "$RUNNER_TEMP/rwb-get-pip.py" --isolated --index-url https://pypi.org/simple
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple -r requirements.lock
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple -e ".[dev]"
      - run: .venv/bin/python -m ruff check generator tests main.py
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python -m pip_audit
